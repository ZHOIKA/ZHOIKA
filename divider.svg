<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="48" viewBox="0 0 440 48">

  <defs>
    <!-- Gradiente da linha -->
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="15%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="85%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowDiv">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Linha base sutil -->
  <line x1="40" y1="24" x2="400" y2="24" stroke="url(#lineFade)" stroke-width="0.4"/>

  <!-- Ornamento central - losango/diamante -->
  <g filter="url(#glowDiv)">
    <path d="M220 14 L228 24 L220 34 L212 24Z" fill="none" stroke="white" stroke-width="0.6" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle cx="220" cy="24" r="1.5" fill="white" opacity="0.4">
      <animate attributeName="r" values="1.5;2.5;1.5" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Estrela esquerda -->
  <text x="120" y="22" fill="white" font-size="7" text-anchor="middle" font-family="Georgia, serif" opacity="0">
    ✧
    <animate attributeName="opacity" values="0;0.35;0.35;0" dur="5s" repeatCount="indefinite" begin="0s"/>
  </text>

  <!-- Estrela direita -->
  <text x="320" y="22" fill="white" font-size="7" text-anchor="middle" font-family="Georgia, serif" opacity="0">
    ✧
    <animate attributeName="opacity" values="0;0.35;0.35;0" dur="5s" repeatCount="indefinite" begin="1.5s"/>
  </text>

  <!-- Pontinhos decorativos esquerda -->
  <circle cx="160" cy="24" r="0.8" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0.2;0.2;0" dur="3.5s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle cx="180" cy="24" r="0.5" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0.12;0.12;0" dur="4.2s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="200" cy="24" r="0.6" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0.15;0.15;0" dur="3.8s" repeatCount="indefinite" begin="1.2s"/>
  </circle>

  <!-- Pontinhos decorativos direita -->
  <circle cx="240" cy="24" r="0.6" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0.15;0.15;0" dur="3.8s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="260" cy="24" r="0.5" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0.12;0.12;0" dur="4.2s" repeatCount="indefinite" begin="2.5s"/>
  </circle>
  <circle cx="280" cy="24" r="0.8" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0.2;0.2;0" dur="3.5s" repeatCount="indefinite" begin="3s"/>
  </circle>

  <!-- Cruz pequena central sutil -->
  <text x="220" y="42" fill="white" font-size="5" text-anchor="middle" font-family="Georgia, serif" opacity="0.06">
    ✟
  </text>

</svg>

