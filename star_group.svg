<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Grupo de estrelas para clusters -->
  <text x="20" y="25" fill="white" font-size="8" text-anchor="middle" font-family="Georgia, serif" opacity="0">
    ✧
    <animate attributeName="opacity" values="0;0.6;0.6;0" dur="3s" repeatCount="indefinite" begin="0s"/>
  </text>
  <text x="80" y="18" fill="white" font-size="10" text-anchor="middle" font-family="Georgia, serif" opacity="0">
    ✦
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="3.5s" repeatCount="indefinite" begin="0.8s"/>
  </text>
  <text x="50" y="45" fill="white" font-size="6" text-anchor="middle" font-family="Georgia, serif" opacity="0">
    ✧
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="4s" repeatCount="indefinite" begin="1.5s"/>
  </text>
  <text x="90" y="55" fill="white" font-size="7" text-anchor="middle" font-family="Georgia, serif" opacity="0">
    ✧
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="2.5s" repeatCount="indefinite" begin="2s"/>
  </text>
  <text x="15" y="65" fill="white" font-size="9" text-anchor="middle" font-family="Georgia, serif" opacity="0">
    ✦
    <animate attributeName="opacity" values="0;0.65;0.65;0" dur="4.2s" repeatCount="indefinite" begin="1s"/>
  </text>
  <text x="60" y="80" fill="white" font-size="5" text-anchor="middle" font-family="Georgia, serif" opacity="0">
    ✧
    <animate attributeName="opacity" values="0;0.45;0.45;0" dur="3.8s" repeatCount="indefinite" begin="0.3s"/>
  </text>
  <text x="35" y="50" fill="white" font-size="5" text-anchor="middle" font-family="Georgia, serif" opacity="0">
    ✧
    <animate attributeName="opacity" values="0;0.55;0;0.55;0" dur="5s" repeatCount="indefinite" begin="2.5s"/>
  </text>
  <!-- Pontinhos extras -->
  <circle cx="70" cy="30" r="0.8" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0;0.4;0" dur="4.5s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle cx="40" cy="75" r="0.6" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0.35;0.35;0" dur="3.2s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="95" cy="90" r="0.7" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0;0.3;0" dur="5.5s" repeatCount="indefinite" begin="3s"/>
  </circle>
</svg>

