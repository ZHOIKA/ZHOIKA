<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <!-- Micro estrela - cintilação suave -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="10" y="15" fill="white" font-size="10" text-anchor="middle" font-family="Georgia, serif" filter="url(#glow)" opacity="0">
    ✧
    <animate attributeName="opacity" values="0;0.9;0;0.9;0" dur="3.5s" repeatCount="indefinite" begin="0.2s"/>
  </text>
</svg>

