<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="380" height="28" viewBox="0 0 380 28">

  <defs>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="20%" stop-color="white" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="80%" stop-color="white" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Linha fina -->
  <line x1="30" y1="14" x2="350" y2="14" stroke="url(#lineFade)" stroke-width="0.3"/>

  <!-- Ornamento central pulsante -->
  <g>
    <circle cx="190" cy="14" r="2.5" fill="none" stroke="white" stroke-width="0.4" opacity="0.15">
      <animate attributeName="r" values="2.5;5;2.5" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.3;0.12" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="14" r="1" fill="white" opacity="0.2">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>

