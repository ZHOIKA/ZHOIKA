<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
xmlns:xlink="http://www.w3.org/1999/xlink"
width="550"
height="280"
viewBox="0 0 550 280">

<defs>

<!-- Glow Principal -->

<radialGradient id="mainGlow"
cx="50%"
cy="50%"
r="60%">

<stop
offset="0%"
stop-color="#ffffff"
stop-opacity=".55"/>

<stop
offset="100%"
stop-color="#ffffff"
stop-opacity="0"/>

</radialGradient>

<!-- Glow Central -->

<radialGradient id="coreGlow">

<stop
offset="0%"
stop-color="#ffffff"/>

<stop
offset="100%"
stop-color="#ffffff"
stop-opacity="0"/>

</radialGradient>

<!-- Blur Grande -->

<filter id="blur10">

<feGaussianBlur
stdDeviation="10"/>

</filter>

<!-- Blur Médio -->

<filter id="blur5">

<feGaussianBlur
stdDeviation="5"/>

</filter>

<!-- Glow Branco -->

<filter id="whiteGlow"
x="-50%"
y="-50%"
width="200%"
height="200%">

<feGaussianBlur
stdDeviation="4"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

<!-- Sombra -->

<filter id="shadow">

<feDropShadow
dx="0"
dy="0"
stdDeviation="4"
flood-color="white"
flood-opacity=".45"/>

</filter>

</defs>


<!-- Luz principal -->

<circle
    cx="275"
    cy="120"
    r="115"
    fill="url(#mainGlow)"
    filter="url(#blur10)"
    opacity=".28">

    <animate
        attributeName="r"
        values="110;125;110"
        dur="6s"
        repeatCount="indefinite"/>

    <animate
        attributeName="opacity"
        values=".18;.42;.18"
        dur="6s"
        repeatCount="indefinite"/>

</circle>

<!-- Luz secundária -->

<circle
    cx="275"
    cy="120"
    r="82"
    fill="url(#mainGlow)"
    filter="url(#blur5)"
    opacity=".18">

    <animate
        attributeName="r"
        values="82;92;82"
        dur="4s"
        repeatCount="indefinite"/>

</circle>

<!-- Glow central -->

<circle
    cx="275"
    cy="120"
    r="10"
    fill="url(#coreGlow)"
    filter="url(#whiteGlow)">

    <animate
        attributeName="r"
        values="8;13;8"
        dur="2.8s"
        repeatCount="indefinite"/>

    <animate
        attributeName="opacity"
        values=".55;1;.55"
        dur="2.8s"
        repeatCount="indefinite"/>

</circle>

<!-- Raios suaves -->

<g opacity=".08">

<line
    x1="275"
    y1="25"
    x2="275"
    y2="215"
    stroke="white"
    stroke-width=".5">

    <animate
        attributeName="opacity"
        values=".05;.16;.05"
        dur="5s"
        repeatCount="indefinite"/>

</line>

<line
    x1="175"
    y1="120"
    x2="375"
    y2="120"
    stroke="white"
    stroke-width=".5">

    <animate
        attributeName="opacity"
        values=".03;.12;.03"
        dur="5s"
        repeatCount="indefinite"/>

</line>

</g>

<!-- Neblina inicial -->

<ellipse
    cx="275"
    cy="175"
    rx="145"
    ry="28"
    fill="white"
    opacity=".02"
    filter="url(#blur10)">

    <animate
        attributeName="opacity"
        values=".01;.05;.01"
        dur="7s"
        repeatCount="indefinite"/>

</ellipse>
<!-- ===================================================== -->
<!--          ANGELCORE VOLUMETRIC FOG                     -->
<!-- ===================================================== -->

<g id="fog">

<ellipse
cx="275"
cy="165"
rx="170"
ry="35"
fill="white"
opacity=".015"
filter="url(#blur10)">

<animate
attributeName="rx"
values="165;180;165"
dur="9s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values=".01;.035;.01"
dur="9s"
repeatCount="indefinite"/>

</ellipse>

<ellipse
cx="275"
cy="175"
rx="150"
ry="28"
fill="white"
opacity=".02"
filter="url(#blur5)">

<animate
attributeName="rx"
values="150;162;150"
dur="8s"
repeatCount="indefinite"/>

</ellipse>

<ellipse
cx="275"
cy="190"
rx="120"
ry="18"
fill="white"
opacity=".015"
filter="url(#blur5)">

<animate
attributeName="opacity"
values=".01;.03;.01"
dur="6s"
repeatCount="indefinite"/>

</ellipse>

</g>

<!-- ===================================================== -->
<!--               FLOATING PARTICLES                      -->
<!-- ===================================================== -->

<g id="particles" fill="white">

<circle cx="245" cy="150" r="1">

<animate
attributeName="cy"
values="150;138;150"
dur="6s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values="0;.6;0"
dur="6s"
repeatCount="indefinite"/>

</circle>

<circle cx="265" cy="165" r="1.2">

<animate
attributeName="cy"
values="165;150;165"
dur="7s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values="0;.7;0"
dur="7s"
repeatCount="indefinite"/>

</circle>

<circle cx="285" cy="158" r="1">

<animate
attributeName="cy"
values="158;145;158"
dur="5.5s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values="0;.5;0"
dur="5.5s"
repeatCount="indefinite"/>

</circle>

<circle cx="305" cy="170" r="1.3">

<animate
attributeName="cy"
values="170;156;170"
dur="6.8s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values="0;.8;0"
dur="6.8s"
repeatCount="indefinite"/>

</circle>

<circle cx="225" cy="175" r=".9">

<animate
attributeName="cy"
values="175;160;175"
dur="7.5s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values="0;.5;0"
dur="7.5s"
repeatCount="indefinite"/>

</circle>

</g>

<!-- ===================================================== -->
<!--              LIGHT DUST                               -->
<!-- ===================================================== -->

<g opacity=".08">

<circle cx="210" cy="110" r="35"
fill="white"
filter="url(#blur10)"/>

<circle cx="340" cy="105" r="30"
fill="white"
filter="url(#blur10)"/>

<circle cx="275" cy="90" r="25"
fill="white"
filter="url(#blur10)"/>

</g>

<!-- ===================================================== -->
<!--              PREMIUM ANGEL HALO                       -->
<!-- ===================================================== -->

<g id="halo">

<!-- Anel externo -->

<ellipse
cx="275"
cy="52"
rx="52"
ry="14"
fill="none"
stroke="white"
stroke-width="1"
opacity=".35">

<animate
attributeName="ry"
values="14;18;14"
dur="4s"
repeatCount="indefinite"/>

<animate
attributeName="rx"
values="52;58;52"
dur="4s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values=".25;.7;.25"
dur="4s"
repeatCount="indefinite"/>

</ellipse>


<!-- Anel médio -->

<ellipse
cx="275"
cy="52"
rx="40"
ry="10"
fill="none"
stroke="white"
stroke-width=".8"
opacity=".45">

<animate
attributeName="ry"
values="10;13;10"
dur="3s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values=".2;.8;.2"
dur="3s"
repeatCount="indefinite"/>

</ellipse>


<!-- Anel interno -->

<ellipse
cx="275"
cy="52"
rx="28"
ry="7"
fill="none"
stroke="white"
stroke-width=".5"
opacity=".25">

<animate
attributeName="rx"
values="28;34;28"
dur="5s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values=".15;.5;.15"
dur="5s"
repeatCount="indefinite"/>

</ellipse>


<!-- Brilho central da auréola -->

<circle
cx="275"
cy="52"
r="3"
fill="white"
filter="url(#whiteGlow)">

<animate
attributeName="r"
values="3;6;3"
dur="2s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values=".4;1;.4"
dur="2s"
repeatCount="indefinite"/>

</circle>


<!-- Pequenos pontos orbitando -->

<g fill="white">

<circle cx="225" cy="52" r="1">

<animateTransform
attributeName="transform"
type="rotate"
from="0 275 52"
to="360 275 52"
dur="12s"
repeatCount="indefinite"/>

</circle>


<circle cx="325" cy="52" r="1">

<animateTransform
attributeName="transform"
type="rotate"
from="360 275 52"
to="0 275 52"
dur="15s"
repeatCount="indefinite"/>

</circle>

</g>

</g>

<!-- ===================================================== -->
<!--                 STARS & BRIGHTS                         -->
<!-- ===================================================== -->

<g id="stars">

<text x="70" y="45" fill="white" font-size="12" font-family="Georgia" opacity="0">
  ✦
  <animate attributeName="opacity" values="0;0.9;0.9;0" dur="4s" repeatCount="indefinite" begin="0s"/>
</text>

<text x="160" y="30" fill="white" font-size="9" font-family="Georgia" opacity="0">
  ✧
  <animate attributeName="opacity" values="0;0.7;0.7;0" dur="3.5s" repeatCount="indefinite" begin="0.8s"/>
</text>

<text x="430" y="35" fill="white" font-size="13" font-family="Georgia" opacity="0">
  ✦
  <animate attributeName="opacity" values="0;0.95;0.95;0" dur="5s" repeatCount="indefinite" begin="1.5s"/>
</text>

<text x="350" y="22" fill="white" font-size="8" font-family="Georgia" opacity="0">
  ✧
  <animate attributeName="opacity" values="0;0.6;0.6;0" dur="4.2s" repeatCount="indefinite" begin="0.4s"/>
</text>

<text x="480" y="60" fill="white" font-size="10" font-family="Georgia" opacity="0">
  ✦
  <animate attributeName="opacity" values="0;0.8;0.8;0" dur="4.8s" repeatCount="indefinite" begin="2.2s"/>
</text>

<text x="40" y="85" fill="white" font-size="9" font-family="Georgia" opacity="0">
  ✧
  <animate attributeName="opacity" values="0;0.65;0.65;0" dur="3.8s" repeatCount="indefinite" begin="2s"/>
</text>

</g>

<!-- ===================================================== -->
<!--                 COMETS / SHOOTING STARS                -->
<!-- ===================================================== -->

<g id="comets">

<line x1="50" y1="20" x2="95" y2="65" stroke="white" stroke-width="0.8" opacity="0">
  <animate attributeName="opacity" values="0;0.85;0" dur="3.2s" repeatCount="indefinite" begin="0.5s"/>
  <animate attributeName="x1" values="50;140" dur="3.2s" repeatCount="indefinite" begin="0.5s"/>
  <animate attributeName="y1" values="20;110" dur="3.2s" repeatCount="indefinite" begin="0.5s"/>
  <animate attributeName="x2" values="95;185" dur="3.2s" repeatCount="indefinite" begin="0.5s"/>
  <animate attributeName="y2" values="65;155" dur="3.2s" repeatCount="indefinite" begin="0.5s"/>
</line>

<line x1="490" y1="25" x2="445" y2="70" stroke="white" stroke-width="0.8" opacity="0">
  <animate attributeName="opacity" values="0;0.75;0" dur="4.2s" repeatCount="indefinite" begin="1.8s"/>
  <animate attributeName="x1" values="490;385" dur="4.2s" repeatCount="indefinite" begin="1.8s"/>
  <animate attributeName="y1" values="25;98" dur="4.2s" repeatCount="indefinite" begin="1.8s"/>
  <animate attributeName="x2" values="445;340" dur="4.2s" repeatCount="indefinite" begin="1.8s"/>
  <animate attributeName="y2" values="70;143" dur="4.2s" repeatCount="indefinite" begin="1.8s"/>
</line>

</g>

<!-- ===================================================== -->
<!--                    LEFT WING                            -->
<!-- ===================================================== -->

<g id="left-wing">

<animateTransform attributeName="transform" type="rotate" values="0 275 120; -7 275 120; 0 275 120" dur="3.2s" repeatCount="indefinite" />
<animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="3.2s" repeatCount="indefinite" additive="sum"/>

<path d="M275 120 Q200 25 100 40 Q45 50 12 92 Q-2 122 0 148 Q16 128 55 115 Q95 102 140 94 L275 120Z" fill="white" opacity="0.18"/>
<path d="M275 120 Q205 35 122 45 Q66 55 33 92 Q20 112 17 138 Q33 122 66 110 Q100 98 145 90 L275 120Z" fill="white" opacity="0.38"/>
<path d="M275 120 Q210 45 144 52 Q94 60 61 95 Q47 110 42 128 Q64 114 91 104 Q124 92 163 84 L275 120Z" fill="white" opacity="0.68"/>
<path d="M275 120 Q225 58 175 64 Q135 70 102 96 Q90 108 85 120 Q102 110 125 102 Q152 92 185 86 L275 120Z" fill="white" opacity="0.88"/>

</g>

<!-- ===================================================== -->
<!--                    RIGHT WING                           -->
<!-- ===================================================== -->

<g id="right-wing">

<animateTransform attributeName="transform" type="rotate" values="0 275 120; 7 275 120; 0 275 120" dur="3.2s" repeatCount="indefinite" />
<animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="3.2s" repeatCount="indefinite" additive="sum"/>

<path d="M275 120 Q350 25 450 40 Q505 50 538 92 Q552 122 550 148 Q534 128 495 115 Q455 102 410 94 L275 120Z" fill="white" opacity="0.18"/>
<path d="M275 120 Q345 35 428 45 Q484 55 517 92 Q530 112 533 138 Q517 122 484 110 Q450 98 405 90 L275 120Z" fill="white" opacity="0.38"/>
<path d="M275 120 Q340 45 406 52 Q456 60 489 95 Q503 110 508 128 Q486 114 459 104 Q426 92 387 84 L275 120Z" fill="white" opacity="0.68"/>
<path d="M275 120 Q325 58 375 64 Q415 70 448 96 Q460 108 465 120 Q448 110 425 102 Q398 92 365 86 L275 120Z" fill="white" opacity="0.88"/>

</g>

<!-- ===================================================== -->
<!--               CENTRAL LIGHT NUCLEUS                    -->
<!-- ===================================================== -->

<circle cx="275" cy="120" r="4" fill="white" opacity="0.8" filter="url(#whiteGlow)">
  <animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
</circle>

<!-- ===================================================== -->
<!--                    TITLE ZHOIKA                         -->
<!-- ===================================================== -->

<text x="275" y="215" fill="white" font-size="36" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" letter-spacing="12" opacity="0.9">
  ZHOIKA
  <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
</text>

<!-- ===================================================== -->
<!--                    SUBTITLE                             -->
<!-- ===================================================== -->

<text x="275" y="245" fill="white" font-size="10" text-anchor="middle" font-family="'Courier New', monospace" letter-spacing="12" opacity="0.3">
  ET LVX IN TENEBRIS LVCET
  <animate attributeName="opacity" values="0.15;0.45;0.15" dur="5s" repeatCount="indefinite"/>
</text>

</svg>



