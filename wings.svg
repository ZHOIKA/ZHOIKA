<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
xmlns:xlink="http://www.w3.org/1999/xlink"
width="550"
height="280"
viewBox="0 0 550 280">

<defs>

<!-- Glow Principal -->
<radialGradient id="mainGlow" cx="50%" cy="50%" r="60%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>

<!-- Glow Central -->
<radialGradient id="coreGlow">
  <stop offset="0%" stop-color="#ffffff"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>

<!-- Gradiente para asas - base -->
<linearGradient id="wingGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity=".15"/>
  <stop offset="100%" stop-color="#aaccff" stop-opacity=".05"/>
</linearGradient>

<linearGradient id="wingGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity=".35"/>
  <stop offset="100%" stop-color="#bbddff" stop-opacity=".12"/>
</linearGradient>

<linearGradient id="wingGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity=".65"/>
  <stop offset="100%" stop-color="#ddeeff" stop-opacity=".25"/>
</linearGradient>

<linearGradient id="wingGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity=".92"/>
  <stop offset="100%" stop-color="#eef4ff" stop-opacity=".45"/>
</linearGradient>

<linearGradient id="wingGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity=".50"/>
  <stop offset="100%" stop-color="#cce0ff" stop-opacity=".15"/>
</linearGradient>

<!-- Blur Grande -->
<filter id="blur10">
  <feGaussianBlur stdDeviation="10"/>
</filter>

<!-- Blur Médio -->
<filter id="blur5">
  <feGaussianBlur stdDeviation="5"/>
</filter>

<filter id="blur3">
  <feGaussianBlur stdDeviation="3"/>
</filter>

<!-- Glow Branco -->
<filter id="whiteGlow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- Sombra -->
<filter id="shadow">
  <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="white" flood-opacity=".45"/>
</filter>

</defs>

<!-- ===================================================== -->
<!--              BACKGROUND GLOWS                          -->
<!-- ===================================================== -->

<!-- Luz principal -->
<circle cx="275" cy="120" r="115" fill="url(#mainGlow)" filter="url(#blur10)" opacity=".28">
  <animate attributeName="r" values="110;125;110" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".18;.42;.18" dur="6s" repeatCount="indefinite"/>
</circle>

<!-- Luz secundária -->
<circle cx="275" cy="120" r="82" fill="url(#mainGlow)" filter="url(#blur5)" opacity=".18">
  <animate attributeName="r" values="82;92;82" dur="4s" repeatCount="indefinite"/>
</circle>

<!-- Glow central -->
<circle cx="275" cy="120" r="10" fill="url(#coreGlow)" filter="url(#whiteGlow)">
  <animate attributeName="r" values="8;13;8" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".55;1;.55" dur="2.8s" repeatCount="indefinite"/>
</circle>

<!-- Raios suaves -->
<g opacity=".08">
  <line x1="275" y1="25" x2="275" y2="215" stroke="white" stroke-width=".5">
    <animate attributeName="opacity" values=".05;.16;.05" dur="5s" repeatCount="indefinite"/>
  </line>
  <line x1="175" y1="120" x2="375" y2="120" stroke="white" stroke-width=".5">
    <animate attributeName="opacity" values=".03;.12;.03" dur="5s" repeatCount="indefinite"/>
  </line>
</g>

<!-- Neblina inicial -->
<ellipse cx="275" cy="175" rx="145" ry="28" fill="white" opacity=".02" filter="url(#blur10)">
  <animate attributeName="opacity" values=".01;.05;.01" dur="7s" repeatCount="indefinite"/>
</ellipse>

<!-- ===================================================== -->
<!--          ANGELCORE VOLUMETRIC FOG                     -->
<!-- ===================================================== -->

<g id="fog">
  <ellipse cx="275" cy="165" rx="170" ry="35" fill="white" opacity=".015" filter="url(#blur10)">
    <animate attributeName="rx" values="165;180;165" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".01;.035;.01" dur="9s" repeatCount="indefinite"/>
  </ellipse>
</g>

<!-- ===================================================== -->
<!--              PARTÍCULAS FLUTUANTES                    -->
<!-- ===================================================== -->

<g id="particles">
  <circle cx="255" cy="155" r=".8">
    <animate attributeName="cy" values="155;140;155" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.6;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="295" cy="148" r="1">
    <animate attributeName="cy" values="148;135;148" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.55;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="265" cy="165" r="1.2">
    <animate attributeName="cy" values="165;150;165" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.7;0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="285" cy="158" r="1">
    <animate attributeName="cy" values="158;145;158" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.5;0" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="305" cy="170" r="1.3">
    <animate attributeName="cy" values="170;156;170" dur="6.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.8;0" dur="6.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="225" cy="175" r=".9">
    <animate attributeName="cy" values="175;160;175" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.5;0" dur="7.5s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- ===================================================== -->
<!--              LIGHT DUST                               -->
<!-- ===================================================== -->

<g opacity=".08">
  <circle cx="210" cy="110" r="35" fill="white" filter="url(#blur10)"/>
  <circle cx="340" cy="105" r="30" fill="white" filter="url(#blur10)"/>
  <circle cx="275" cy="90" r="25" fill="white" filter="url(#blur10)"/>
</g>

<!-- ===================================================== -->
<!--              PREMIUM ANGEL HALO                       -->
<!-- ===================================================== -->

<g id="halo">
  <ellipse cx="275" cy="52" rx="52" ry="14" fill="none" stroke="white" stroke-width="1" opacity=".35">
    <animate attributeName="ry" values="14;18;14" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="52;58;52" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".25;.7;.25" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="275" cy="52" rx="40" ry="10" fill="none" stroke="white" stroke-width=".8" opacity=".45">
    <animate attributeName="ry" values="10;13;10" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".2;.8;.2" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="275" cy="52" rx="28" ry="7" fill="none" stroke="white" stroke-width=".5" opacity=".25">
    <animate attributeName="rx" values="28;34;28" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;.5;.15" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="275" cy="52" r="3" fill="white" filter="url(#whiteGlow)">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <g fill="white">
    <circle cx="225" cy="52" r="1">
      <animateTransform attributeName="transform" type="rotate" from="0 275 52" to="360 275 52" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="325" cy="52" r="1">
      <animateTransform attributeName="transform" type="rotate" from="360 275 52" to="0 275 52" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>
</g>

<!-- ===================================================== -->
<!--                    LEFT WING                           -->
<!-- ===================================================== -->

<g id="left-wing">

  <animateTransform attributeName="transform" type="rotate" values="0 275 120; -8 275 120; 0 275 120" dur="3.8s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="3.8s" repeatCount="indefinite" additive="sum"/>

  <!-- Camada base - asa inteira com gradiente suave -->
  <path d="M275 120 Q230 90 180 70 Q130 50 80 55 Q40 60 15 85 Q-5 110 5 140 Q20 125 50 115 Q90 100 130 92 Q170 85 210 90 L275 120Z" fill="url(#wingGrad1)" filter="url(#blur2)"/>

  <!-- Penas primárias externas (longas) -->
  <path d="M275 120 Q220 70 150 48 Q95 32 50 38 Q20 42 5 65 Q-5 88 0 115 Q15 100 42 90 Q75 78 110 72 L275 120Z" fill="url(#wingGrad2)"/>

  <!-- Penas secundárias - camada 1 -->
  <path d="M275 120 Q225 78 162 58 Q115 45 72 50 Q38 55 20 75 Q8 92 10 110 Q25 98 55 88 Q90 78 132 73 L275 120Z" fill="url(#wingGrad3)"/>

  <!-- Penas secundárias - camada 2 -->
  <path d="M275 120 Q230 85 175 65 Q135 52 100 55 Q65 60 45 78 Q32 92 32 108 Q48 98 72 90 Q102 80 145 74 L275 120Z" fill="url(#wingGrad4)"/>

  <!-- Penas terciárias (próximas ao centro) -->
  <path d="M275 120 Q240 92 195 75 Q160 62 130 65 Q100 68 82 82 Q68 92 65 106 Q80 98 100 92 Q128 84 168 80 L275 120Z" fill="url(#wingGrad4)"/>

  <!-- Detalhes de penas individuais - primárias -->
  <g stroke="white" stroke-width="0.3" fill="none" opacity="0.25">
    <path d="M230 95 Q180 60 120 45 Q80 35 55 42"/>
    <path d="M235 98 Q185 68 130 55 Q90 48 65 52"/>
    <path d="M240 102 Q190 75 140 62 Q105 55 80 60"/>
  </g>

  <!-- Brilho nas bordas das penas -->
  <path d="M275 120 Q210 60 140 42 Q85 28 45 35 Q15 42 2 68 Q-8 95 0 120" stroke="white" stroke-width="0.6" fill="none" opacity="0.15" filter="url(#blur2)">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="3.8s" repeatCount="indefinite"/>
  </path>

</g>

<!-- ===================================================== -->
<!--                    RIGHT WING                          -->
<!-- ===================================================== -->

<g id="right-wing">

  <animateTransform attributeName="transform" type="rotate" values="0 275 120; 8 275 120; 0 275 120" dur="3.8s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="3.8s" repeatCount="indefinite" additive="sum"/>

  <!-- Camada base -->
  <path d="M275 120 Q320 90 370 70 Q420 50 470 55 Q510 60 535 85 Q555 110 545 140 Q530 125 500 115 Q460 100 420 92 Q380 85 340 90 L275 120Z" fill="url(#wingGrad1)" filter="url(#blur2)"/>

  <!-- Penas primárias externas -->
  <path d="M275 120 Q330 70 400 48 Q455 32 500 38 Q530 42 545 65 Q555 88 550 115 Q535 100 508 90 Q475 78 440 72 L275 120Z" fill="url(#wingGrad2)"/>

  <!-- Penas secundárias - camada 1 -->
  <path d="M275 120 Q325 78 388 58 Q435 45 478 50 Q512 55 530 75 Q542 92 540 110 Q525 98 495 88 Q460 78 418 73 L275 120Z" fill="url(#wingGrad3)"/>

  <!-- Penas secundárias - camada 2 -->
  <path d="M275 120 Q320 85 375 65 Q415 52 450 55 Q485 60 505 78 Q518 92 518 108 Q502 98 478 90 Q448 80 405 74 L275 120Z" fill="url(#wingGrad4)"/>

  <!-- Penas terciárias -->
  <path d="M275 120 Q310 92 355 75 Q390 62 420 65 Q450 68 468 82 Q482 92 485 106 Q470 98 450 92 Q422 84 382 80 L275 120Z" fill="url(#wingGrad4)"/>

  <!-- Detalhes de penas individuais -->
  <g stroke="white" stroke-width="0.3" fill="none" opacity="0.25">
    <path d="M320 95 Q370 60 430 45 Q470 35 495 42"/>
    <path d="M315 98 Q365 68 420 55 Q460 48 485 52"/>
    <path d="M310 102 Q360 75 410 62 Q445 55 470 60"/>
  </g>

  <!-- Brilho nas bordas -->
  <path d="M275 120 Q340 60 410 42 Q465 28 505 35 Q535 42 548 68 Q558 95 550 120" stroke="white" stroke-width="0.6" fill="none" opacity="0.15" filter="url(#blur2)">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="3.8s" repeatCount="indefinite"/>
  </path>

</g>

<!-- ===================================================== -->
<!--               FEATHER DETAILS (ambas as asas)          -->
<!-- ===================================================== -->

<!-- Pequenas penas soltas / down feathers -->
<g id="down-feathers" fill="white" opacity="0.12">
  <ellipse cx="160" cy="95" rx="8" ry="2" transform="rotate(-30 160 95)">
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="4.2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="390" cy="95" rx="8" ry="2" transform="rotate(30 390 95)">
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="4.2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="130" cy="75" rx="6" ry="1.5" transform="rotate(-20 130 75)">
    <animate attributeName="opacity" values="0.06;0.18;0.06" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="420" cy="75" rx="6" ry="1.5" transform="rotate(20 420 75)">
    <animate attributeName="opacity" values="0.06;0.18;0.06" dur="5s" repeatCount="indefinite"/>
  </ellipse>
</g>

<!-- Pontas das penas primárias mais definidas -->
<g id="feather-tips" fill="white" opacity="0.2">
  <path d="M55 42 Q40 35 30 38 Q38 40 50 45Z"/>
  <path d="M65 48 Q48 40 38 44 Q46 47 60 50Z"/>
  <path d="M80 55 Q62 48 52 52 Q60 54 75 57Z"/>
  <path d="M495 42 Q510 35 520 38 Q512 40 500 45Z"/>
  <path d="M485 48 Q502 40 512 44 Q504 47 490 50Z"/>
  <path d="M470 55 Q488 48 498 52 Q490 54 475 57Z"/>
</g>

<!-- ===================================================== -->
<!--               CENTRAL LIGHT NUCLEUS                    -->
<!-- ===================================================== -->

<circle cx="275" cy="120" r="5" fill="white" opacity="0.85" filter="url(#whiteGlow)">
  <animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
</circle>

<!-- ===================================================== -->
<!--                    TITLE ZHOIKA                        -->
<!-- ===================================================== -->

<text x="275" y="215" fill="white" font-size="36" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" letter-spacing="12" opacity="0.9">
  ZHOIKA
  <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
</text>

<!-- ===================================================== -->
<!--                    SUBTITLE                            -->
<!-- ===================================================== -->

<text x="275" y="245" fill="white" font-size="10" text-anchor="middle" font-family="'Courier New', monospace" letter-spacing="12" opacity="0.3">
  ET LVX IN TENEBRIS LVCET
  <animate attributeName="opacity" values="0.15;0.45;0.15" dur="5s" repeatCount="indefinite"/>
</text>

</svg>

