<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
  <!-- Estrela com brilho em cruz -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" dur="4.5s" repeatCount="indefinite" begin="1.5s"/>
    <text x="15" y="18" fill="white" font-size="10" text-anchor="middle" font-family="Georgia, serif">✦</text>
    <!-- Raios da estrela -->
    <line x1="15" y1="4" x2="15" y2="26" stroke="white" stroke-width="0.5" opacity="0.4"/>
    <line x1="4" y1="15" x2="26" y2="15" stroke="white" stroke-width="0.5" opacity="0.4"/>
  </g>
</svg>

