<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="52" viewBox="0 0 440 52">

  <defs>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="12%" stop-color="white" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.1"/>
      <stop offset="88%" stop-color="white" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowS">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Linha dupla -->
  <line x1="35" y1="20" x2="405" y2="20" stroke="url(#lineFade)" stroke-width="0.3"/>
  <line x1="60" y1="26" x2="380" y2="26" stroke="url(#lineFade)" stroke-width="0.15"/>

  <!-- Ornamento central - flor angelical -->
  <g filter="url(#glowS)">
    <!-- Pétalas -->
    <ellipse cx="220" cy="16" rx="3" ry="7" fill="none" stroke="white" stroke-width="0.4" opacity="0.15"
      transform="rotate(0 220 23)">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="220" cy="16" rx="3" ry="7" fill="none" stroke="white" stroke-width="0.4" opacity="0.15"
      transform="rotate(72 220 23)">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite" begin="0.2s"/>
    </ellipse>
    <ellipse cx="220" cy="16" rx="3" ry="7" fill="none" stroke="white" stroke-width="0.4" opacity="0.15"
      transform="rotate(144 220 23)">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite" begin="0.4s"/>
    </ellipse>
    <ellipse cx="220" cy="16" rx="3" ry="7" fill="none" stroke="white" stroke-width="0.4" opacity="0.15"
      transform="rotate(216 220 23)">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite" begin="0.6s"/>
    </ellipse>
    <ellipse cx="220" cy="16" rx="3" ry="7" fill="none" stroke="white" stroke-width="0.4" opacity="0.15"
      transform="rotate(288 220 23)">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite" begin="0.8s"/>
    </ellipse>

    <!-- Centro -->
    <circle cx="220" cy="23" r="1.5" fill="white" opacity="0.3">
      <animate attributeName="r" values="1.5;2.5;1.5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Partículas subindo/descendo -->
  <circle cx="170" cy="23" r="0.6" fill="white" opacity="0">
    <animate attributeName="cy" values="23;16;23" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.18;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="270" cy="23" r="0.5" fill="white" opacity="0">
    <animate attributeName="cy" values="23;15;23" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.14;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="23" r="0.4" fill="white" opacity="0">
    <animate attributeName="cy" values="23;18;23" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.1;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="290" cy="23" r="0.4" fill="white" opacity="0">
    <animate attributeName="cy" values="23;17;23" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.1;0" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Estrelas laterais -->
  <text x="100" y="21" fill="white" font-size="6" text-anchor="middle" font-family="Georgia, serif" opacity="0">
    ✧
    <animate attributeName="opacity" values="0;0.25;0.25;0" dur="4.5s" repeatCount="indefinite" begin="0s"/>
  </text>
  <text x="340" y="21" fill="white" font-size="6" text-anchor="middle" font-family="Georgia, serif" opacity="0">
    ✧
    <animate attributeName="opacity" values="0;0.25;0.25;0" dur="4.5s" repeatCount="indefinite" begin="2s"/>
  </text>

</svg>

